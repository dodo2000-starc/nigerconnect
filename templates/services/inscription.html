{% extends "base.html" %}
{% block title %}Devenir prestataire{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:700px;">
    <h2 class="section-title">Devenir Prestataire</h2>
    <p class="text-muted mb-4">Inscrivez-vous pour offrir vos services et recevoir des demandes.</p>
    <div class="card p-4">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Type de service *</label>
                    <select class="form-select" name="service_type" required>
                        {% for s in types_service %}
                        <option value="{{ s }}"
                            {{ 'selected' if prestataire and prestataire.service_type == s }}>
                            {{ s }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Années d'expérience</label>
                    <input type="number" class="form-control" name="experience_years"
                           min="0" value="{{ prestataire.experience_years if prestataire else 0 }}">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Spécialités</label>
                    <input type="text" class="form-control" name="specialites"
                           placeholder="Ex: Installation, Réparation, Dépannage urgent"
                           value="{{ prestataire.specialites if prestataire else '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea class="form-control" name="description" rows="3"
                              placeholder="Décrivez votre expérience...">{{ prestataire.description if prestataire else '' }}</textarea>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Tarif minimum (FCFA)</label>
                    <input type="number" class="form-control" name="tarif_min"
                           min="0" value="{{ prestataire.tarif_min|int if prestataire and prestataire.tarif_min else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Tarif maximum (FCFA)</label>
                    <input type="number" class="form-control" name="tarif_max"
                           min="0" value="{{ prestataire.tarif_max|int if prestataire and prestataire.tarif_max else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Téléphone</label>
                    <input type="text" class="form-control" name="telephone"
                           value="{{ prestataire.telephone if prestataire else current_user.telephone }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Ville</label>
                    <select class="form-select" name="ville">
                        {% for v in villes %}
                        <option value="{{ v }}"
                            {{ 'selected' if prestataire and prestataire.ville == v }}>{{ v }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Quartier</label>
                    <input type="text" class="form-control" name="quartier"
                           value="{{ prestataire.quartier if prestataire else '' }}">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-nc-primary">
                        <i class="fas fa-save me-2"></i>
                        {{ 'Mettre à jour' if prestataire else 'M\'inscrire comme prestataire' }}
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
